services:
  web:
    build: .
    container_name: garagentor-renovation.ch
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-garagentor2024}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-garagentor-3cx-2024}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY}
      - TCX_CLIENT_ID=${TCX_CLIENT_ID}
      - TCX_CLIENT_SECRET=${TCX_CLIENT_SECRET}
      - TCX_URL=${TCX_URL}
      - INBOUND_SECRET=${INBOUND_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - NODE_ENV=production
      - TZ=Europe/Zurich
      - PORT=3007
      - HOSTNAME=127.0.0.1
