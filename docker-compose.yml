services:
  web:
    build: .
    container_name: garagentor-renovation.ch
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:3000"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-garagentor2024}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-garagentor-3cx-2024}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY}
      - BREVO_SMTP_LOGIN=${BREVO_SMTP_LOGIN}
      - NODE_ENV=production
