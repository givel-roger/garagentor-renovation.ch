services:
  web:
    build: .
    container_name: garagentor-renovation
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-garagentor2024}
      - NODE_ENV=production
